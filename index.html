<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智能存钱记账助手</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--primary:#2563eb;--primary-light:#3b82f6;--primary-dark:#1d4ed8;--primary-bg:#eff6ff;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 4px 12px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--nav-h:60px;--bottom-h:64px}
[data-theme="dark"]{--primary:#3b82f6;--primary-light:#60a5fa;--primary-dark:#2563eb;--primary-bg:#1e293b;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 12px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s,color .3s}
a{text-decoration:none;color:var(--primary)}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none}

/* Top Nav */
.top-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;box-shadow:var(--shadow)}
.top-nav .logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:var(--primary)}
.top-nav .logo i{font-size:22px}
.top-nav .actions{display:flex;align-items:center;gap:12px}
.top-nav .actions button{background:none;color:var(--text2);font-size:18px;padding:6px;border-radius:50%;transition:.2s}
.top-nav .actions button:hover{background:var(--primary-bg);color:var(--primary)}

/* Bottom Tab */
.bottom-tab{position:fixed;bottom:0;left:0;right:0;height:var(--bottom-h);background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -1px 3px rgba(0,0,0,.05)}
.bottom-tab .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text3);font-size:10px;transition:.2s;cursor:pointer;position:relative}
.bottom-tab .tab-item i{font-size:20px;transition:.2s}
.bottom-tab .tab-item.active{color:var(--primary)}
.bottom-tab .tab-item.active i{transform:scale(1.1)}
.bottom-tab .tab-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.bottom-tab .tab-center .add-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(37,99,235,.4);margin-top:-20px;transition:.2s}
.bottom-tab .tab-center .add-btn:hover{transform:scale(1.1)}

/* Main Content */
.main-content{padding:calc(var(--nav-h) + 12px) 16px calc(var(--bottom-h) + 16px);max-width:768px;margin:0 auto}
.page{display:none}
.page.active{display:block}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card-title i{color:var(--primary)}

/* Summary Cards */
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.summary-item{background:var(--card);border-radius:var(--radius);padding:14px 12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.summary-item .label{font-size:12px;color:var(--text3);margin-bottom:4px}
.summary-item .value{font-size:18px;font-weight:700}
.summary-item.income .value{color:var(--success)}
.summary-item.expense .value{color:var(--danger)}
.summary-item.balance .value{color:var(--primary)}

/* Bucket Cards */
.bucket-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow)}
.bucket-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bucket-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.bucket-pct{font-size:12px;color:var(--primary);font-weight:600;background:var(--primary-bg);padding:2px 8px;border-radius:10px}
.bucket-amounts{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.bucket-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bucket-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.bucket-warning{font-size:11px;margin-top:4px;padding:4px 8px;border-radius:4px;display:none}
.bucket-warning.yellow{display:block;background:#fef3c7;color:#92400e}
.bucket-warning.red{display:block;background:#fee2e2;color:#991b1b}

/* Transaction List */
.tx-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:12px}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-info .tx-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-info .tx-meta{font-size:12px;color:var(--text3)}
.tx-amount{font-size:15px;font-weight:600;flex-shrink:0}
.tx-amount.expense{color:var(--danger)}
.tx-amount.income{color:var(--success)}
.tx-actions{display:flex;gap:4px;flex-shrink:0}
.tx-actions button{background:none;color:var(--text3);font-size:14px;padding:4px;border-radius:4px;transition:.2s}
.tx-actions button:hover{color:var(--primary);background:var(--primary-bg)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px 16px;padding-bottom:30px;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{font-size:18px;font-weight:700}
.modal-header .close-btn{background:none;font-size:20px;color:var(--text3);padding:4px}
.modal-header .close-btn:hover{color:var(--text)}

/* Form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:14px;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%;justify-content:center}
.btn-sm{padding:6px 12px;font-size:12px}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;border:1px solid var(--border);color:var(--text2);background:var(--bg)}
.tag.active,.tag:hover{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}

/* Category Grid */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--radius-sm);cursor:pointer;transition:.2s;border:2px solid transparent}
.cat-item:hover{background:var(--primary-bg)}
.cat-item.selected{border-color:var(--primary);background:var(--primary-bg)}
.cat-item .cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.cat-item .cat-name{font-size:11px;color:var(--text2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}

/* Goal Card */
.goal-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:10px}
.goal-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}
.goal-title{font-size:15px;font-weight:600}
.goal-deadline{font-size:12px;color:var(--text3)}
.goal-amounts{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.goal-amounts .saved{color:var(--primary);font-weight:600}
.goal-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin-bottom:6px}
.goal-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--primary-light));transition:width .5s}
.goal-footer{display:flex;justify-content:space-between;font-size:12px;color:var(--text3)}

/* Chart Container */
.chart-container{position:relative;height:260px;margin-bottom:12px}

/* Lobster Chat */
.lobster-fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(249,115,22,.4);z-index:150;cursor:pointer;transition:.2s}
.lobster-fab:hover{transform:scale(1.1)}
.lobster-chat{position:fixed;bottom:80px;right:16px;width:340px;max-width:calc(100vw - 32px);height:420px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:150;display:none;flex-direction:column;border:1px solid var(--border);overflow:hidden}
.lobster-chat.show{display:flex}
.lobster-chat-header{padding:12px 16px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;display:flex;align-items:center;gap:8px;font-weight:600}
.lobster-chat-header .close{margin-left:auto;background:none;color:#fff;font-size:18px}
.lobster-messages{flex:1;overflow-y:auto;padding:12px}
.lobster-msg{margin-bottom:10px;max-width:85%}
.lobster-msg.bot{margin-right:auto}
.lobster-msg.user{margin-left:auto;text-align:right}
.lobster-msg .bubble{padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;display:inline-block}
.lobster-msg.bot .bubble{background:var(--primary-bg);color:var(--text);border-bottom-left-radius:4px}
.lobster-msg.user .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.lobster-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
.lobster-input-row input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-size:13px}
.lobster-input-row button{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}

/* Toast */
.toast{position:fixed;top:calc(var(--nav-h) + 10px);left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:300;animation:fadeInOut 3s;box-shadow:var(--shadow-lg)}
.toast.warning{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.toast.danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.toast.success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

/* Celebration */
.celebration{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;pointer-events:none;display:none}
.celebration.show{display:block}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall 3s ease-out forwards}
@keyframes fall{0%{transform:translateY(-100px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Settings */
.settings-section{margin-bottom:20px}
.settings-section h4{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--primary)}
.rule-card{padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:.2s}
.rule-card:hover{border-color:var(--primary)}
.rule-card.active{border-color:var(--primary);background:var(--primary-bg)}
.rule-card .rule-name{font-size:14px;font-weight:600;margin-bottom:4px}
.rule-card .rule-desc{font-size:12px;color:var(--text3)}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text);font-size:13px}
.search-bar input:focus{border-color:var(--primary)}

/* Filter tags row */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state i{font-size:48px;margin-bottom:12px;color:var(--border)}
.empty-state p{font-size:14px}

/* Responsive */
@media(min-width:768px){
  .cat-grid{grid-template-columns:repeat(6,1fr)}
  .summary-grid{gap:16px}
  .summary-item .value{font-size:22px}
}
@media(max-width:374px){
  .summary-grid{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Segment control */
.segment{display:flex;background:var(--bg);border-radius:var(--radius-sm);padding:3px;margin-bottom:12px}
.segment button{flex:1;padding:8px;font-size:13px;font-weight:500;border-radius:6px;background:none;color:var(--text2);transition:.2s}
.segment button.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}

/* Budget list */
.budget-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.budget-item:last-child{border-bottom:none}
.budget-item .bi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.budget-item .bi-info{flex:1;min-width:0}
.budget-item .bi-name{font-size:13px;font-weight:500}
.budget-item .bi-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.budget-item .bi-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.budget-item .bi-amounts{font-size:11px;color:var(--text3);margin-top:2px}
.budget-item .bi-edit{background:none;color:var(--text3);font-size:14px;padding:4px}

/* Tab pills */
.tab-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tab-pills::-webkit-scrollbar{display:none}
.tab-pill{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;background:var(--bg);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:.2s;flex-shrink:0}
.tab-pill.active{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-header{font-size:11px;color:var(--text3);font-weight:600;padding:4px 0}
.cal-day{padding:6px 2px;border-radius:6px;font-size:12px;cursor:pointer;transition:.2s;position:relative;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-day:hover{background:var(--primary-bg)}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700;border-radius:8px}
.cal-day.today:hover{background:var(--primary-dark)}
.cal-day.has-tx .cal-amount{font-size:9px;color:var(--danger);font-weight:600;line-height:1}
.cal-day.today .cal-amount{color:#fff9}
.cal-day.empty{cursor:default}
.cal-day.empty:hover{background:transparent}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav button{background:var(--bg);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;color:var(--text);cursor:pointer;transition:.2s}
.cal-nav button:hover{border-color:var(--primary);color:var(--primary)}
.cal-nav .cal-title{font-size:15px;font-weight:700}
.day-detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.day-detail-panel{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:500px;max-height:60vh;overflow-y:auto;padding:16px;padding-bottom:30px;animation:slideUp .3s}
</style>
</head>
<body>

<!-- Top Nav -->
<nav class="top-nav">
  <div class="logo"><i class="fa-solid fa-piggy-bank"></i> AI记账助手</div>
  <div class="actions">
    <button onclick="toggleTheme()" title="切换主题"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
    <button onclick="openSettings()" title="设置"><i class="fa-solid fa-gear"></i></button>
  </div>
</nav>

<!-- Main Content -->
<div class="main-content">

  <!-- HOME PAGE -->
  <div class="page active" id="page-home">
    <div class="summary-grid">
      <div class="summary-item income"><div class="label" id="incomeLabel">本期收入</div><div class="value" id="homeIncome">¥0</div></div>
      <div class="summary-item expense"><div class="label" id="expenseLabel">本期支出</div><div class="value" id="homeExpense">¥0</div></div>
      <div class="summary-item balance"><div class="label" id="balanceLabel">本期结余</div><div class="value" id="homeBalance">¥0</div></div>
    </div>
    <div id="dailySpendCard" class="card" style="background:linear-gradient(135deg,#eff6ff,#f0fdf4);border-color:#bfdbfe"></div>
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-chart-pie"></i> 资金桶概览</div>
      <div id="bucketList"></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-bullseye"></i> 预算进度</div>
      <div id="budgetOverview"></div>
    </div>
    <div class="card" id="cycleSummaryCard">
    </div>
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i> 最近交易</div>
      <div class="search-bar"><input type="text" placeholder="搜索交易..." id="searchHomeTx" oninput="renderHomeTx()"></div>
      <div id="homeTxList"></div>
    </div>
  </div>

  <!-- ANALYSIS PAGE -->
  <div class="page" id="page-analysis">
    <div class="segment" id="analysisSegment">
      <button class="active" onclick="switchAnalysis('expense-pie')">支出饼图</button>
      <button onclick="switchAnalysis('trend')">收支趋势</button>
      <button onclick="switchAnalysis('compare')">分类对比</button>
      <button onclick="switchAnalysis('savings')">储蓄进度</button>
    </div>
    <div class="card" id="analysisCard">
      <div class="chart-container"><canvas id="analysisChart"></canvas></div>
    </div>
    <div class="card" id="analysisDetail"></div>
  </div>

  <!-- HISTORY PAGE -->
  <div class="page" id="page-history">
    <div class="cal-nav">
      <button onclick="histPrev()"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="cal-title" id="histTitle">2026年5月</span>
      <button onclick="histNext()"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="card">
      <div class="cal-grid" id="histCalendar"></div>
    </div>
    <div class="segment" id="histSegment">
      <button class="active" onclick="switchHistView('summary')">月度总结</button>
      <button onclick="switchHistView('chart')">图表分析</button>
      <button onclick="switchHistView('advice')">建议</button>
    </div>
    <div id="histContent"></div>
  </div>

  <!-- BUDGET PREORDER PAGE -->
  <div class="page" id="page-budget">
    <div class="card" id="budgetRealtimeCard" style="background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-color:#86efac"></div>
    <div class="card" id="budgetAlertCard" style="display:none"></div>

// ==================== HELPERS ====================
function cnNow() {
  // 获取北京时间（东八区）的当前时间
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 8 * 3600000);
}
function todayStr() {
  const d = cnNow();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowTimeStr() {
  const d = cnNow();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtMoney(n) { return '¥' + (n||0).toFixed(2); }

// 获取当前记账周期的起止日期
function getCycleRange() {
  const cn = cnNow();
  const startDay = state.cycleStartDay || 1;
  const today = cn.getDate();
  let startYear, startMonth, endYear, endMonth;
  if (today >= startDay) {
    // 周期从本月startDay开始
    startYear = cn.getFullYear();
    startMonth = cn.getMonth(); // 0-based
    // 结束：下月startDay-1
    const next = new Date(cn.getFullYear(), cn.getMonth() + 1, 1);
    endYear = next.getFullYear();
    endMonth = next.getMonth();
  } else {
    // 周期从上月startDay开始
    const prev = new Date(cn.getFullYear(), cn.getMonth() - 1, 1);
    startYear = prev.getFullYear();
    startMonth = prev.getMonth();
    endYear = cn.getFullYear();
    endMonth = cn.getMonth();
  }
  const startDate = `${startYear}-${String(startMonth+1).padStart(2,'0')}-${String(startDay).padStart(2,'0')}`;
  // 计算结束日：endMonth的startDay-1号
  const endDayDate = new Date(endYear, endMonth, startDay - 1);
  // 如果startDay=1，结束日就是上月最后一天
  const endDate = `${endDayDate.getFullYear()}-${String(endDayDate.getMonth()+1).padStart(2,'0')}-${String(endDayDate.getDate()).padStart(2,'0')}`;
  return { startDate, endDate, startYear, startMonth, endYear, endMonth, startDay };
}
// 获取当前周期的预购列表（按添加日期归属周期）
function getPreordersThisCycle() {
  const { startDate, endDate } = getCycleRange();
  return (state.preorders || []).filter(p => p.date >= startDate && p.date <= endDate);
}

function getCnMonth() {
  const cn = cnNow();
  return { year: cn.getFullYear(), month: cn.getMonth() };
}

function getMonthTx() {
  const { startDate, endDate } = getCycleRange();
  return state.transactions.filter(t => t.date >= startDate && t.date <= endDate);
}
function getActiveRule() {
  const pr = PRESET_RULES.find(r => r.id === state.activeRule);
  if (pr) return pr;
  return state.customRules.find(r => r.id === state.activeRule) || PRESET_RULES[0];
}
function getCatById(id, type) {
  return (state.categories[type] || []).find(c => c.id === id) || (state.categories.expense || []).find(c => c.id === id) || (state.categories.income || []).find(c => c.id === id);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ==================== BUCKETS ====================
function renderBuckets() {
  const rule = getActiveRule();
  const monthTx = getMonthTx();
  const totalExpense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const totalIncome = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const base = totalIncome > 0 ? totalIncome : totalExpense;
  let html = '';
  rule.buckets.forEach(b => {
    // 用户设置的预算优先，没有则按收入比例自动算
    const userBudget = state.budgets.buckets[b.name] || 0;
    const budget = userBudget > 0 ? userBudget : base * b.pct / 100;
    const spent = monthTx.filter(t => t.type === 'expense' && t.bucket === b.name).reduce((s,t) => s + t.amount, 0);
    const remaining = budget - spent;
    const pct = budget > 0 ? Math.min((spent / budget) * 100, 100) : 0;
    let barColor = b.color;
    let warningHtml = '';
    if (budget > 0) {
      const ratio = spent / budget;
      if (ratio >= 1) { barColor = '#ef4444'; warningHtml = `<div class="bucket-warning red"><i class="fa-solid fa-circle-exclamation"></i> 已超支 ${fmtMoney(spent - budget)}</div>`; }
      else if (ratio >= 0.8) { barColor = '#f59e0b'; warningHtml = `<div class="bucket-warning yellow"><i class="fa-solid fa-triangle-exclamation"></i> 已达预算80%</div>`; }
    }
    const remainColor = remaining >= 0 ? '#10b981' : '#ef4444';
    html += `<div class="bucket-card" style="cursor:pointer" onclick="openBucketDetail('${b.name}')">
      <div class="bucket-header"><span class="bucket-name" style="color:${b.color}"><i class="fa-solid fa-circle" style="font-size:8px"></i> ${b.name}</span><span class="bucket-pct">${b.pct}%</span></div>
      <div class="bucket-amounts"><span>已支出 ${fmtMoney(spent)}</span><span>预算 ${fmtMoney(budget)}</span></div>
      <div class="bucket-bar"><div class="bucket-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">
        <span style="font-size:13px;color:var(--text2)">💰 剩余可用</span>
        <span style="font-size:16px;font-weight:700;color:${remainColor}">${remaining >= 0 ? fmtMoney(remaining) : '-' + fmtMoney(Math.abs(remaining))}</span>
      </div>
      ${warningHtml}
      <div style="text-align:center;margin-top:6px"><span style="font-size:11px;color:var(--primary)"><i class="fa-solid fa-arrow-up-right-from-square"></i> 点击查看明细</span></div>
    </div>`;
  });
  document.getElementById('bucketList').innerHTML = html || '<div class="empty-state"><p>暂无资金桶数据</p></div>';
}

function renderCycleSummary() {

  const monthTx = getMonthTx();
  const expTx = monthTx.filter(t => t.type === 'expense');
  const incTx = monthTx.filter(t => t.type === 'income');

  if (!expTx.length && !incTx.length) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';

  const cycle = getCycleRange();
  const startDay = state.cycleStartDay || 1;
  const cycleName = startDay === 1 ? '本月' : `${startDay}号周期`;

  // 总收支
  const totalIncome = incTx.reduce((s,t) => s + t.amount, 0);
  const totalExpense = expTx.reduce((s,t) => s + t.amount, 0);
  const balance = totalIncome - totalExpense;

  // 按分类统计支出

  expTx.forEach(t => {
    const cat = getCatById(t.categoryId, 'expense');
    const name = cat ? cat.name : '其他';
    const bucket = t.bucket || '未分类';
    if (!catStats[name]) catStats[name] = { amount: 0, count: 0, bucket, color: cat?.color || '#94a3b8', icon: cat?.icon || 'fa-tag' };
    catStats[name].amount += t.amount;

function renderBudgetOverview() {
  const rule = getActiveRule();
  const monthTx = getMonthTx();
  let html = '';
  rule.buckets.forEach(b => {
    const budget = state.budgets.buckets[b.name] || 0;
    if (budget <= 0) return;
    const spent = monthTx.filter(t=>t.type==='expense'&&t.bucket===b.name).reduce((s,t)=>s+t.amount,0);
    const remaining = budget - spent;
    const pct = Math.min(spent/budget*100, 100);
    let barColor = b.color;
    if (pct >= 100) barColor = '#ef4444';
    else if (pct >= 80) barColor = '#f59e0b';
    const remainColor = remaining >= 0 ? '#10b981' : '#ef4444';
    html += `<div class="budget-item">
      <div class="bi-icon" style="background:${b.color}"><i class="fa-solid fa-circle"></i></div>
      <div class="bi-info"><div class="bi-name">${b.name}</div><div class="bi-bar"><div class="bi-bar-fill" style="width:${pct}%;background:${barColor}"></div></div><div class="bi-amounts">${fmtMoney(spent)} / ${fmtMoney(budget)} · <span style="color:${remainColor};font-weight:600">剩余 ${remaining>=0?fmtMoney(remaining):'-'+fmtMoney(Math.abs(remaining))}</span></div></div>
      <button class="bi-edit" onclick="openBudgetModal('bucket','${b.name}',${budget})"><i class="fa-solid fa-pen"></i></button>
    </div>`;
  });
  // Category budgets
  state.categories.expense.forEach(c => {
    const budget = state.budgets.categories[c.id] || 0;
    if (budget <= 0) return;
    const spent = monthTx.filter(t=>t.type==='expense'&&t.categoryId===c.id).reduce((s,t)=>s+t.amount,0);
    const remaining = budget - spent;
    const pct = Math.min(spent/budget*100, 100);
    let barColor = c.color;
    if (pct >= 100) barColor = '#ef4444';
    else if (pct >= 80) barColor = '#f59e0b';
    const remainColor = remaining >= 0 ? '#10b981' : '#ef4444';
    html += `<div class="budget-item">
      <div class="bi-icon" style="background:${c.color}"><i class="fa-solid ${c.icon}"></i></div>
      <div class="bi-info"><div class="bi-name">${c.name}</div><div class="bi-bar"><div class="bi-bar-fill" style="width:${pct}%;background:${barColor}"></div></div><div class="bi-amounts">${fmtMoney(spent)} / ${fmtMoney(budget)} · <span style="color:${remainColor};font-weight:600">剩余 ${remaining>=0?fmtMoney(remaining):'-'+fmtMoney(Math.abs(remaining))}</span></div></div>
      <button class="bi-edit" onclick="openBudgetModal('category','${c.id}',${budget})"><i class="fa-solid fa-pen"></i></button>
    </div>`;
  });
  document.getElementById('budgetOverview').innerHTML = html || '<div class="empty-state"><p>未设置预算，前往设置页配置</p></div>';
}

function openBudgetModal(type, key, current) {
  const name = type === 'bucket' ? key : (getCatById(key, 'expense')||{}).name || key;
  document.getElementById('budgetItemName').textContent = name + ' 月预算';
  document.getElementById('budgetAmount').value = current || '';
  document.getElementById('budgetKey').value = type + ':' + key;
  openModal('budgetModal');
}
function saveBudgetItem() {
  const [type, key] = document.getElementById('budgetKey').value.split(':');
  const amount = parseFloat(document.getElementById('budgetAmount').value) || 0;
  if (type === 'bucket') state.budgets.buckets[key] = amount;
  else state.budgets.categories[key] = amount;
  saveState();
  closeModal('budgetModal');
  renderBudgetOverview();
  renderBudgetSettings();
}

  txs = txs.slice(0, 30);
  document.getElementById('homeTxList').innerHTML = renderTxList(txs);
}

function renderAllTx() {
  const search = (document.getElementById('searchAllTx')?.value || '').toLowerCase();
  let txs = [...state.transactions].sort((a,b) => new Date(b.date+' '+b.time) - new Date(a.date+' '+a.time));
  if (search) txs = txs.filter(t => (t.note||'').toLowerCase().includes(search) || t.amount.toString().includes(search));
  if (state.txFilterType !== 'all') txs = txs.filter(t => t.type === state.txFilterType);

  return txs.map(t => {
    const cat = getCatById(t.categoryId, t.type) || {name:'未知',icon:'fa-question',color:'#94a3b8'};

      <div class="tx-icon" style="background:${cat.color}20;color:${cat.color}"><i class="fa-solid ${cat.icon}"></i></div>
      <div class="tx-info"><div class="tx-name">${t.note || cat.name}</div><div class="tx-meta">${cat.name} · ${t.bucket||''} · ${t.date}</div></div>

      <div class="tx-actions">

        <button onclick="deleteTx('${t.id}')" title="删除"><i class="fa-solid fa-trash"></i></button>

// 快速新增自定义分类（在记账弹窗中）
function quickAddCat() {
  const name = prompt('新分类名称：');
  if (!name || !name.trim()) return;
  const type = state.txType;
  const rule = getActiveRule();
  let bucket = '';
  if (type === 'expense') {
    const bucketName = prompt('归类到哪个资金桶？\n可选：' + rule.buckets.map(b => b.name).join('、'), rule.buckets[0].name);
    if (bucketName === null) return;
    const matched = matchBucket(bucketName.trim(), rule.buckets);
    bucket = matched || rule.buckets[0].name;
  }
  const colors = ['#ef4444','#f97316','#f59e0b','#10b981','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#ec4899','#14b8a6'];
  const cat = {
    id: uid(),
    name: name.trim(),
    icon: 'fa-tag',
    color: colors[Math.floor(Math.random() * colors.length)],
    bucket: bucket
  };
  state.categories[type].push(cat);
  saveState();
  selectedTxCatId = cat.id;
  renderTxCatGrid(cat.id);
  document.getElementById('txBucket').value = bucket || rule.buckets[0].name;
  showToast(`已添加分类「${cat.name}」→ ${bucket || '收入'}`, 'success');
}

function renderTxBucketSelect() {
  const rule = getActiveRule();
  const buckets = state.txType === 'income' ? ['（收入）'] : rule.buckets.map(b => b.name);
  document.getElementById('txBucket').innerHTML = buckets.map(b => `<option value="${b}">${b}</option>`).join('');
}

function aiClassify() {
  const note = document.getElementById('txNote').value.toLowerCase();
  if (!note) return;
  let bestCat = null, bestScore = 0;
  for (const [catId, keywords] of Object.entries(AI_KEYWORDS)) {
    for (const kw of keywords) {
      if (note.includes(kw) && kw.length > bestScore) {
        bestScore = kw.length;
        bestCat = catId;
      }
    }
  }
  if (bestCat) {
    selectedTxCatId = bestCat;
    renderTxCatGrid(bestCat);
    const cat = getCatById(bestCat, state.txType);
    if (cat) {
      const rule = getActiveRule();
      const matched = cat.bucket ? matchBucket(cat.bucket, rule.buckets) : null;
      document.getElementById('txBucket').value = matched || rule.buckets[0].name;
    }
    // Try to extract amount from note
    const amountMatch = note.match(/(\d+\.?\d*)\s*元/);
    if (amountMatch && !document.getElementById('txAmount').value) {
      document.getElementById('txAmount').value = parseFloat(amountMatch[1]);
    }
  }
}

function saveTransaction() {
  const amount = parseFloat(document.getElementById('txAmount').value);
  if (!amount || amount <= 0) { showToast('请输入有效金额', 'warning'); return; }
  const editId = document.getElementById('txEditId').value;
  const tx = {
    id: editId || uid(),
    type: state.txType,
    amount: amount,
    note: document.getElementById('txNote').value,
    categoryId: selectedTxCatId,
    bucket: document.getElementById('txBucket').value,
    date: document.getElementById('txDate').value,
    time: document.getElementById('txTime').value
  };
  if (editId) {
    const idx = state.transactions.findIndex(t => t.id === editId);
    if (idx >= 0) state.transactions[idx] = tx;
  } else {
    state.transactions.push(tx);
  }
  // Check budget alerts
  checkBudgetAlert(tx);
  saveState();
  closeModal('addTxModal');
  selectedTxCatId = '';
  renderAll();
}

function editTx(id) {
  const tx = state.transactions.find(t => t.id === id);
  if (!tx) return;
  state.txType = tx.type;
  updateTxTypeSeg();
  document.getElementById('txEditId').value = tx.id;
  document.getElementById('txAmount').value = tx.amount;
  document.getElementById('txNote').value = tx.note || '';
  document.getElementById('txDate').value = tx.date;
  document.getElementById('txTime').value = tx.time;
  selectedTxCatId = tx.categoryId;
  renderTxCatGrid(tx.categoryId);
  renderTxBucketSelect();
  document.getElementById('txBucket').value = tx.bucket || '';
  openModal('addTxModal');
}

function deleteTx(id) {
  if (!confirm('确定删除该交易？')) return;
  state.transactions = state.transactions.filter(t => t.id !== id);
  saveState();
  renderAll();
}

function checkBudgetAlert(tx) {
  if (tx.type !== 'expense') return;
  const monthTx = getMonthTx();
  // Check bucket budget
  const bucketBudget = state.budgets.buckets[tx.bucket] || 0;
  if (bucketBudget > 0) {
    const bucketSpent = monthTx.filter(t=>t.type==='expense'&&t.bucket===tx.bucket).reduce((s,t)=>s+t.amount,0);
    const ratio = bucketSpent / bucketBudget;
    if (ratio >= 1) showToast(`「${tx.bucket}」已超支！${fmtMoney(bucketSpent - bucketBudget)}`, 'danger');
    else if (ratio >= 0.8) showToast(`「${tx.bucket}」已达预算80%`, 'warning');
  }
  // Check category budget
  const catBudget = state.budgets.categories[tx.categoryId] || 0;
  if (catBudget > 0) {
    const catSpent = monthTx.filter(t=>t.type==='expense'&&t.categoryId===tx.categoryId).reduce((s,t)=>s+t.amount,0);
    const ratio = catSpent / catBudget;
    const catName = (getCatById(tx.categoryId,'expense')||{}).name || '';
    if (ratio >= 1) showToast(`「${catName}」已超支！${fmtMoney(catSpent - catBudget)}`, 'danger');
    else if (ratio >= 0.8) showToast(`「${catName}」已达预算80%`, 'warning');
  }
}

// ==================== ANALYSIS ====================
let analysisChart = null;
function switchAnalysis(type) {
  state.analysisType = type;
  document.querySelectorAll('#analysisSegment button').forEach((b,i) => b.classList.toggle('active',
    (type==='expense-pie'&&i===0)||(type==='trend'&&i===1)||(type==='compare'&&i===2)||(type==='savings'&&i===3)
  ));
  renderAnalysis();
}

function renderAnalysis() {
  if (analysisChart) { analysisChart.destroy(); analysisChart = null; }
  const canvas = document.getElementById('analysisChart');
  const ctx = canvas.getContext('2d');
  const monthTx = getMonthTx();
  const detail = document.getElementById('analysisDetail');
  detail.innerHTML = '';

  if (state.analysisType === 'expense-pie') {
    renderExpensePie(ctx, monthTx, detail);
  } else if (state.analysisType === 'trend') {
    renderTrendChart(ctx, detail);
  } else if (state.analysisType === 'compare') {
    renderCompareChart(ctx, detail);
  } else if (state.analysisType === 'savings') {
    renderSavingsChart(ctx, detail);
  }
}

function renderExpensePie(ctx, monthTx, detail) {
  const rule = getActiveRule();
  const expTx = monthTx.filter(t => t.type === 'expense');
  const bucketData = rule.buckets.map(b => ({
    name: b.name,
    amount: expTx.filter(t => t.bucket === b.name).reduce((s,t) => s + t.amount, 0),
    color: b.color
  })).filter(d => d.amount > 0);

  if (!bucketData.length) { detail.innerHTML = '<div class="empty-state"><p>本月暂无支出数据</p></div>'; return; }

  analysisChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: bucketData.map(d => d.name),
      datasets: [{ data: bucketData.map(d => d.amount), backgroundColor: bucketData.map(d => d.color), borderWidth: 2, borderColor: getComputedStyle(document.documentElement).getPropertyValue('--card').trim() }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, font: { size: 12 } } } }
    }
  });

  // Category breakdown
  const catData = {};
  expTx.forEach(t => {
    const cat = getCatById(t.categoryId, 'expense');
    const name = cat ? cat.name : '其他';
    catData[name] = (catData[name] || 0) + t.amount;
  });
  const sortedCats = Object.entries(catData).sort((a,b) => b[1] - a[1]);
  detail.innerHTML = '<div class="card-title"><i class="fa-solid fa-list"></i> 分类明细</div>' +
    sortedCats.map(([name, amt]) => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${name}</span><span style="font-weight:600">${fmtMoney(amt)}</span></div>`).join('');
}

function renderTrendChart(ctx, detail) {
  const months = [];
  const cn = cnNow();
  const startDay = state.cycleStartDay || 1;
  // 生成最近6个周期的起止日期
  const cycles = [];
  for (let i = 5; i >= 0; i--) {
    // 计算i个周期前的起始月份
    let refMonth = cn.getMonth() - i;
    let refYear = cn.getFullYear();
    // 如果当前日期在周期起始日之前，周期起始月要再往前一个月
    if (cn.getDate() < startDay) {
      refMonth -= 1;
    }
    const refDate = new Date(refYear, refMonth, 1);
    const sYear = refDate.getFullYear();
    const sMonth = refDate.getMonth();
    const sDate = `${sYear}-${String(sMonth+1).padStart(2,'0')}-${String(startDay).padStart(2,'0')}`;
    const eDateObj = new Date(sYear, sMonth + 1, startDay - 1);
    const eDate = `${eDateObj.getFullYear()}-${String(eDateObj.getMonth()+1).padStart(2,'0')}-${String(eDateObj.getDate()).padStart(2,'0')}`;
    const label = startDay === 1 ? `${sYear}-${String(sMonth+1).padStart(2,'0')}` : `${sMonth+1}/${startDay}`;
    cycles.push({ sDate, eDate, label });
  }
  const incomeData = cycles.map(c => state.transactions.filter(t => t.type==='income'&&t.date>=c.sDate&&t.date<=c.eDate).reduce((s,t)=>s+t.amount,0));
  const expenseData = cycles.map(c => state.transactions.filter(t => t.type==='expense'&&t.date>=c.sDate&&t.date<=c.eDate).reduce((s,t)=>s+t.amount,0));

  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();

  analysisChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: cycles.map(c => c.label),
      datasets: [
        { label: '收入', data: incomeData, borderColor: '#10b981', backgroundColor: '#10b98120', tension: .4, fill: true },
        { label: '支出', data: expenseData, borderColor: '#ef4444', backgroundColor: '#ef444420', tension: .4, fill: true }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor } }, x: { grid: { display: false }, ticks: { color: textColor } } },
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, font: { size: 12 } } } }
    }
  });

  const totalIncome = incomeData.reduce((s,v) => s+v, 0);
  const totalExpense = expenseData.reduce((s,v) => s+v, 0);
  detail.innerHTML = `<div class="card-title"><i class="fa-solid fa-calculator"></i> 半年汇总</div>
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div><div style="font-size:12px;color:var(--text3)">总收入</div><div style="font-size:16px;font-weight:700;color:#10b981">${fmtMoney(totalIncome)}</div></div>
      <div><div style="font-size:12px;color:var(--text3)">总支出</div><div style="font-size:16px;font-weight:700;color:#ef4444">${fmtMoney(totalExpense)}</div></div>
      <div><div style="font-size:12px;color:var(--text3)">总结余</div><div style="font-size:16px;font-weight:700;color:#3b82f6">${fmtMoney(totalIncome-totalExpense)}</div></div>
    </div>`;
}

function renderCompareChart(ctx, detail) {
  const cycle = getCycleRange();
  // 本周期
  const thisStart = cycle.startDate;
  const thisEnd = cycle.endDate;
  // 上周期：往前推一个周期
  const startDay = state.cycleStartDay || 1;
  const startParts = thisStart.split('-');
  const prevRef = new Date(parseInt(startParts[0]), parseInt(startParts[1]) - 2, 1);
  const prevSYear = prevRef.getFullYear();
  const prevSMonth = prevRef.getMonth();
  const lastStart = `${prevSYear}-${String(prevSMonth+1).padStart(2,'0')}-${String(startDay).padStart(2,'0')}`;
  const lastEndObj = new Date(parseInt(startParts[0]), parseInt(startParts[1]) - 1, startDay - 1);
  const lastEnd = `${lastEndObj.getFullYear()}-${String(lastEndObj.getMonth()+1).padStart(2,'0')}-${String(lastEndObj.getDate()).padStart(2,'0')}`;

  const rule = getActiveRule();
  const thisData = rule.buckets.map(b => state.transactions.filter(t => t.type==='expense'&&t.bucket===b.name&&t.date>=thisStart&&t.date<=thisEnd).reduce((s,t)=>s+t.amount,0));
  const lastData = rule.buckets.map(b => state.transactions.filter(t => t.type==='expense'&&t.bucket===b.name&&t.date>=lastStart&&t.date<=lastEnd).reduce((s,t)=>s+t.amount,0));

  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();

  analysisChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: rule.buckets.map(b => b.name),
      datasets: [
        { label: '本月', data: thisData, backgroundColor: '#3b82f680' },

// ==================== GOALS ====================
function renderGoals() {
  const list = document.getElementById('goalsList');
  if (!state.goals.length) { list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-bullseye"></i><p>还没有存钱目标，点击上方新建</p></div>'; return; }
  const allTx = state.transactions;
  list.innerHTML = state.goals.map(g => {
    // 计算已存金额：手动存入 + 关联桶的交易总额
    let manualSaved = g.saved || 0;
    let bucketSaved = 0;
    if (g.bucket) {
      bucketSaved = allTx.filter(t => t.type === 'expense' && t.bucket === g.bucket).reduce((s, t) => s + t.amount, 0);
    }
    const totalSaved = manualSaved + bucketSaved;
    const pct = g.target > 0 ? Math.min(totalSaved / g.target * 100, 100) : 0;
    const daysLeft = g.deadline ? Math.max(0, Math.ceil((new Date(g.deadline + 'T23:59:59+08:00') - cnNow()) / 86400000)) : null;
    const monthlyNeeded = daysLeft > 0 ? Math.max(0, (g.target - totalSaved) / (daysLeft / 30)) : 0;
    const dailyNeeded = daysLeft > 0 ? Math.max(0, (g.target - totalSaved) / daysLeft) : 0;
    return `<div class="goal-card">
      <div class="goal-header">
        <div><div class="goal-title">${g.name} ${g.bucket ? `<span style="font-size:11px;color:var(--text3);font-weight:400">🔗 ${g.bucket}</span>` : ''}</div><div class="goal-deadline">${g.deadline ? '截止 '+g.deadline : '无截止日期'}</div></div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-outline btn-sm" onclick="addToGoal('${g.id}')"><i class="fa-solid fa-plus"></i></button>
          <button class="btn btn-outline btn-sm" onclick="editGoal('${g.id}')"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-outline btn-sm" onclick="deleteGoal('${g.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <div class="goal-amounts"><span class="saved">${fmtMoney(totalSaved)}</span><span>目标 ${fmtMoney(g.target)}</span></div>
      <div class="goal-bar"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
      <div class="goal-footer">
        <span>完成 ${pct.toFixed(1)}%${g.bucket ? `（手动${fmtMoney(manualSaved)} + 桶${fmtMoney(bucketSaved)}）` : ''}</span>
        ${daysLeft !== null ? `<span>剩余 ${daysLeft} 天 · 每月需存 ${fmtMoney(monthlyNeeded)} · 每日 ${fmtMoney(dailyNeeded)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

    </div>`

function matchBucket(targetBucket, ruleBuckets) {
  if (!targetBucket) return null;
  // 精确匹配
  if (ruleBuckets.find(b => b.name === targetBucket)) return targetBucket;
  // 模糊匹配：目标桶名包含在法则桶名中，或法则桶名包含在目标桶名中
  for (const b of ruleBuckets) {
    if (b.name.includes(targetBucket) || targetBucket.includes(b.name)) return b.name;
  }
  // 关键词匹配
  const keywordMap = {
    '生活必需': ['生活','必需','日常','生存'],
    '弹性消费': ['弹性','消费','想要','非必需','娱乐','休闲'],
    '储蓄投资': ['储蓄','投资','存款','理财','财务自由','长期储蓄'],
    '应急备用': ['应急','备用','突发','紧急'],
    '储蓄': ['储蓄','存款','存钱'],
    '投资': ['投资','理财','基金','股票'],
    '保险': ['保险','社保'],
    '保险投资': ['保险','投资','理财'],
    '娱乐': ['娱乐','休闲','玩乐'],
    '教育成长': ['教育','学习','成长','培训'],
    '慈善捐赠': ['慈善','捐赠','公益']
  };
  const targetKeywords = keywordMap[targetBucket] || [targetBucket];
  for (const kw of targetKeywords) {
    for (const b of ruleBuckets) {
      if (b.name.includes(kw) || kw.includes(b.name)) return b.name;
    }
  }
  return null;
}

function switchRule(id) {
  state.activeRule = id;
  const rule = getActiveRule();
  state.transactions.forEach(t => {
    if (t.type === 'expense') {
      const cat = getCatById(t.categoryId, 'expense');
      const catBucket = cat?.bucket || '';
      const matched = catBucket ? matchBucket(catBucket, rule.buckets) : null;
      t.bucket = matched || matchBucket(t.bucket, rule.buckets) || rule.buckets[0].name;
    }
  });
  saveState();
  renderAll();
}

  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      Object.assign(state, data);
      saveState();
      renderAll();
      showToast('恢复成功', 'success');
    } catch(err) { showToast('文件格式错误', 'danger'); }

  reader.readAsText(file);
}

  histMonth--;
  if (histMonth < 0) { histMonth = 11; histYear--; }
  renderHistory();
}

function histNext() {
  histMonth++;
  if (histMonth > 11) { histMonth = 0; histYear++; }
  renderHistory();
}

function switchHistView(view) {
  histView = view;
  document.querySelectorAll('#histSegment button').forEach((b,i) => b.classList.toggle('active',
    (view==='summary'&&i===0)||(view==='chart'&&i===1)||(view==='advice'&&i===2)
  ));
  renderHistContent();
}

function renderHistory() {
  if (!histYear) initHistory();
  const startDay = state.cycleStartDay || 1;
  if (startDay === 1) {
    document.getElementById('histTitle').textContent = `${histYear}年${histMonth+1}月`;
  } else {
    const sDate = `${histYear}-${String(histMonth+1).padStart(2,'0')}-${String(startDay).padStart(2,'0')}`;
    const eDateObj = new Date(histYear, histMonth + 1, startDay - 1);
    const eDate = `${eDateObj.getMonth()+1}月${eDateObj.getDate()}日`;
    document.getElementById('histTitle').textContent = `${histMonth+1}月${startDay}日-${eDate}`;
  }
  renderHistCalendar();
  renderHistContent();
}

function getHistTx() {
  const startDay = state.cycleStartDay || 1;
  // 按用户设置的周期计算该"周期月"的起止日期
  // 例如：用户设置15号开始，查看5月，则周期为5月15日-6月14日
  let cycleStart, cycleEnd;
  if (startDay === 1) {
    // 自然月
    cycleStart = `${histYear}-${String(histMonth+1).padStart(2,'0')}-01`;
    cycleEnd = `${histYear}-${String(histMonth+1).padStart(2,'0')}-${new Date(histYear, histMonth+1, 0).getDate()}`;
  } else {
    // 自定义周期
    cycleStart = `${histYear}-${String(histMonth+1).padStart(2,'0')}-${String(startDay).padStart(2,'0')}`;
    const endDateObj = new Date(histYear, histMonth + 1, startDay - 1);
    cycleEnd = `${endDateObj.getFullYear()}-${String(endDateObj.getMonth()+1).padStart(2,'0')}-${String(endDateObj.getDate()).padStart(2,'0')}`;
  }
  return state.transactions.filter(t => t.date >= cycleStart && t.date <= cycleEnd);
}

function renderHistCalendar() {
  const txs = getHistTx();
  const firstDay = new Date(histYear, histMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(histYear, histMonth + 1, 0).getDate();
  const cn = cnNow();
  const isCurrentMonth = histYear === cn.getFullYear() && histMonth === cn.getMonth();
  const todayDate = cn.getDate();

  // 按天统计支出
  const dayExp = {};
  txs.filter(t => t.type === 'expense').forEach(t => {
    const d = parseInt(t.date.split('-')[2]);
    dayExp[d] = (dayExp[d] || 0) + t.amount;
  });

  const weekdays = ['日','一','二','三','四','五','六'];
  let html = weekdays.map(w => `<div class="cal-header">${w}</div>`).join('');

  // 空白填充
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = isCurrentMonth && d === todayDate;
    const exp = dayExp[d] || 0;
    const hasTx = exp > 0;
    html += `<div class="cal-day${isToday?' today':''}${hasTx?' has-tx':''}" onclick="openDayDetail(${d})">
      <span>${d}</span>
      ${hasTx ? `<span class="cal-amount">${exp>=1000?(exp/1000).toFixed(1)+'k':exp.toFixed(0)}</span>` : ''}
    </div>`;
  }

  document.getElementById('histCalendar').innerHTML = html;
}

  const dayExp = dayTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

      <h3 style="font-size:16px">${histMonth+1}月${day}日</h3>

        <div style="font-size:11px;color:var(--text3)">支出</div>
        <div style="font-size:15px;font-weight:700;color:#ef4444">${fmtMoney(dayExp)}</div>
      </div>
      <div style="flex:1;padding:8px;background:var(--bg);border-radius:8px;text-align:center">
        <div style="font-size:11px;color:var(--text3)">收入</div>
        <div style="font-size:15px;font-weight:700;color:#10b981">${fmtMoney(dayInc)}</div>
      </div>
    </div>`;

  if (dayTx.length) {
    dayTx.forEach(t => {
      const cat = getCatById(t.categoryId, t.type) || {name:'未知',icon:'fa-question',color:'#94a3b8'};

    catStats[name].amount += t.amount;

  // 交易明细列表
  if (bucketTx.length) {
    bucketTx.forEach(t => {
      const cat = getCatById(t.categoryId, 'expense') || {name:'未知',icon:'fa-question',color:'#94a3b8'};
      html += `<div class="tx-item">
        <div class="tx-icon" style="background:${cat.color}20;color:${cat.color}"><i class="fa-solid ${cat.icon}"></i></div>
        <div class="tx-info"><div class="tx-name">${t.note || cat.name}</div><div class="tx-meta">${cat.name} · ${t.date} ${t.time||''}</div></div>
        <div class="tx-amount expense">- ${fmtMoney(t.amount)}</div>
      </div>`;
    });
  } else {
    html += '<div class="empty-state" style="padding:20px"><i class="fa-solid fa-receipt"></i><p>该桶暂无支出记录</p></div>';
  }

  html += '</div>';
  const overlay = document.createElement('div');
  overlay.className = 'day-detail-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

// ==================== BUDGET PREORDER PAGE ====================
const PO_CATS = [
  {name:'网购消费',icon:'fa-cart-shopping',color:'#3b82f6'},
  {name:'餐饮伙食',icon:'fa-utensils',color:'#ef4444'},
  {name:'数码设备',icon:'fa-laptop',color:'#6366f1'},
  {name:'生活用品',icon:'fa-basket-shopping',color:'#f97316'},
  {name:'人情开销',icon:'fa-gift',color:'#ec4899'},
  {name:'交通出行',icon:'fa-bus',color:'#06b6d4'},
  {name:'娱乐消费',icon:'fa-gamepad',color:'#8b5cf6'},
  {name:'其他支出',icon:'fa-ellipsis',color:'#94a3b8'}
];

function getRealBalance() {
  const allTx = state.transactions;
  const income = allTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = allTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return income - expense;
}

function getPreorderTotal() {
  // 返回当前周期预购总额（修改周期起始日后会自动跟着变化）
  return getPreordersThisCycle().reduce((s,p)=>s+p.price,0);
}

function renderBudgetPage() {
  const realBalance = getRealBalance();
  const { startDate, endDate } = getCycleRange();
  const preorders = getPreordersThisCycle();
  const preTotal = preorders.reduce((s,p) => s + p.price, 0);
  const remain = realBalance - preTotal;
  const minLine = state.budgetMinLine || 500;

  // 顶部实时同步卡片
  const balanceColor = realBalance >= 0 ? '#10b981' : '#ef4444';
  const remainColor = remain >= 0 ? '#10b981' : '#ef4444';
  document.getElementById('budgetRealtimeCard').innerHTML = `
    <div style="text-align:center;margin-bottom:8px">
      <div style="font-size:12px;color:var(--text3)">主账户真实余额（实时同步）</div>
      <div style="font-size:32px;font-weight:800;color:${balanceColor}">${fmtMoney(realBalance)}</div>
    </div>
    ${preorders.length ? `
    <div style="text-align:center;padding:10px 0;border-top:1px dashed var(--border)">
      <div style="font-size:14px;font-weight:600;color:#10b981">
        ${fmtMoney(realBalance)} <span style="color:#10b981">- ${fmtMoney(preTotal)}</span> = <span style="color:#10b981">${fmtMoney(remain)}</span>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">真实余额 - 预购总支出 = 预算剩余余额</div>
    </div>` : ''}
  `;

  // 智能风险提醒
  let alerts = [];
  if (remain < minLine && preorders.length > 0) alerts.push({type:'danger',msg:`🔴 应急备用金不足！预算剩余 ${fmtMoney(remain)} 低于底线 ${fmtMoney(minLine)}`});
  if (realBalance > 0 && preTotal > realBalance * 0.5 && preorders.length > 0) alerts.push({type:'warning',msg:`🟡 预购总额占比过高（${(preTotal/realBalance*100).toFixed(0)}%），结余紧张`});
  const nonEssential = preorders.filter(p=>['网购消费','娱乐消费','数码设备'].includes(p.cat)).reduce((s,p)=>s+p.price,0);
  if (nonEssential > preTotal * 0.6 && preorders.length >= 3) alerts.push({type:'warning',msg:`🟠 非必要消费（网购/娱乐/数码）占比 ${preTotal>0?(nonEssential/preTotal*100).toFixed(0):0}%，建议控制`});
  if (remain < 0 && preorders.length > 0) alerts.push({type:'danger',msg:`⛔ 预购总额已超过真实余额！超支 ${fmtMoney(Math.abs(remain))}`});

  const alertCard = document.getElementById('budgetAlertCard');
  if (alerts.length) {
    alertCard.style.display = '';
    alertCard.innerHTML = alerts.map(a => `<div style="padding:8px 12px;margin-bottom:6px;border-radius:8px;font-size:13px;font-weight:500;background:${a.type==='danger'?'#fee2e2':'#fef3c7'};color:${a.type==='danger'?'#991b1b':'#92400e'}">${a.msg}</div>`).join('');
  } else {
    alertCard.style.display = 'none';
  }

  // 预购清单
  if (!preorders.length) {
    document.getElementById('preorderList').innerHTML = '<div class="empty-state"><i class="fa-solid fa-cart-shopping"></i><p>暂无预购项目，点击上方添加</p></div>';
  } else {
    document.getElementById('preorderList').innerHTML = preorders.map(p => {
      const catInfo = PO_CATS.find(c=>c.name===p.cat) || PO_CATS[7];
      return `<div class="card" style="padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;background:${catInfo.color}"><i class="fa-solid ${catInfo.icon}"></i></div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600">${p.name}</div>
            <div style="font-size:11px;color:var(--text3)">${p.cat} · ${p.date}</div>
          </div>
          <div style="font-size:16px;font-weight:700;color:var(--danger);flex-shrink:0">-${fmtMoney(p.price)}</div>
        </div>
        <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end">
          <button class="btn btn-outline btn-sm" onclick="editPreorder('${p.id}')"><i class="fa-solid fa-pen"></i> 编辑</button>
          <button class="btn btn-outline btn-sm" onclick="deletePreorder('${p.id}')"><i class="fa-solid fa-trash"></i> 删除</button>
          <button class="btn btn-primary btn-sm" onclick="confirmPurchase('${p.id}')"><i class="fa-solid fa-bag-shopping"></i> 已真实购买</button>
        </div>
      </div>`;
    }).join('');
  }

  // 统计分析
  if (preorders.length) {
    const catTotals = {};
    preorders.forEach(p => { catTotals[p.cat] = (catTotals[p.cat]||0)+p.price; });
    const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
    document.getElementById('preorderStats').innerHTML = `
      <div class="card-title"><i class="fa-solid fa-chart-pie"></i> 预购统计</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <div style="flex:1;padding:8px;background:var(--bg);border-radius:8px;text-align:center">
          <div style="font-size:11px;color:var(--text3)">预购总额</div>
          <div style="font-size:15px;font-weight:700;color:#ef4444">${fmtMoney(preTotal)}</div>
        </div>
        <div style="flex:1;padding:8px;background:var(--bg);border-radius:8px;text-align:center">
          <div style="font-size:11px;color:var(--text3)">预购笔数</div>
          <div style="font-size:15px;font-weight:700">${preorders.length}笔</div>
        </div>
        <div style="flex:1;padding:8px;background:var(--bg);border-radius:8px;text-align:center">
          <div style="font-size:11px;color:var(--text3)">预算剩余</div>
          <div style="font-size:15px;font-weight:700;color:${remainColor}">${fmtMoney(remain)}</div>
        </div>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">分类占比</div>
      ${sorted.map(([cat,amt])=>{
        const catInfo = PO_CATS.find(c=>c.name===cat)||PO_CATS[7];
        const pct = preTotal>0?(amt/preTotal*100).toFixed(1):0;
        return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">
          <span style="width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:${catInfo.color}"><i class="fa-solid ${catInfo.icon}"></i></span>
          <span style="flex:1">${cat}</span>
          <span style="font-weight:600">${fmtMoney(amt)}</span>
          <span style="color:var(--text3);font-size:11px;min-width:36px;text-align:right">${pct}%</span>
        </div>`;
      }).join('')}
    `;
  } else {
    document.getElementById('preorderStats').innerHTML = '';
  }

  // 底线设置
  document.getElementById('budgetMinInput').value = minLine;
}

function openPreorderModal(editId) {
  const p = editId ? (state.preorders||[]).find(x=>x.id===editId) : null;
  document.getElementById('poEditId').value = editId || '';
  document.getElementById('poName').value = p ? p.name : '';
  document.getElementById('poPrice').value = p ? p.price : '';
  document.getElementById('poCat').value = p ? p.cat : '网购消费';
  openModal('preorderModal');
}

function savePreorder() {
  const name = document.getElementById('poName').value.trim();
  const price = parseFloat(document.getElementById('poPrice').value);
  if (!name || !price || price <= 0) { showToast('请填写物品名称和价格', 'warning'); return; }
  const editId = document.getElementById('poEditId').value;
  const item = {
    id: editId || uid(),
    name,
    price,
    cat: document.getElementById('poCat').value,
    date: todayStr()
  };
  if (!state.preorders) state.preorders = [];
  if (editId) {
    const idx = state.preorders.findIndex(x=>x.id===editId);
    if (idx >= 0) state.preorders[idx] = item;
  } else {
    state.preorders.push(item);
  }
  saveState();
  closeModal('preorderModal');
  renderBudgetPage();
}

function editPreorder(id) { openPreorderModal(id); }

function deletePreorder(id) {
  if (!confirm('确定删除该预购项？')) return;
  state.preorders = (state.preorders||[]).filter(p=>p.id!==id);
  saveState();
  renderBudgetPage();
}

function confirmPurchase(id) {
  const p = (state.preorders||[]).find(x=>x.id===id);
  if (!p) return;
  if (!confirm(`确认已真实购买「${p.name}」¥${p.price.toFixed(2)}？\n将从主账户扣款并生成消费记录。`)) return;

  // 1. 从主账户扣款 → 自动生成真实消费记账记录
  const rule = getActiveRule();
  const bucket = rule.buckets[0].name; // 默认归第一个桶
  const tx = {
    id: uid(),
    type: 'expense',
    amount: p.price,
    note: `预购核销：${p.name}`,
    categoryId: 'otherexp',
    bucket: bucket,
    date: todayStr(),
    time: nowTimeStr()
  };
  state.transactions.push(tx);

  // 2. 从预购清单移除
  state.preorders = state.preorders.filter(x=>x.id!==id);
  saveState();
  renderBudgetPage();
  renderAll();
  showToast(`已核销「${p.name}」${fmtMoney(p.price)}，主账户已扣款`, 'success');
}

function saveBudgetMin() {
  state.budgetMinLine = parseFloat(document.getElementById('budgetMinInput').value) || 500;
  saveState();
  renderBudgetPage();
}

function sendLobster() {
  const input = document.getElementById('lobsterInput');
  const text = input.value.trim();
  if (!text) return;
  addLobsterMsg('user', text);
  input.value = '';
  setTimeout(() => processLobsterCmd(text), 500);
}

function processLobsterCmd(text) {
  const lower = text.toLowerCase();

  // Try to parse as a transaction
  const txMatch = lower.match(/(.+?)(花了|花费|支出|付了|用了|消费)\s*(\d+\.?\d*)\s*元?/) ||
                  lower.match(/(.+?)(\d+\.?\d*)\s*元/);
  if (txMatch) {
    const note = txMatch[1].replace(/[今天昨天前天]/g, '').trim();
    const amount = parseFloat(txMatch[txMatch.length-1]);
    if (amount > 0) {
      // AI classify
      let bestCat = null, bestScore = 0;
      for (const [catId, keywords] of Object.entries(AI_KEYWORDS)) {
        for (const kw of keywords) {
          if (lower.includes(kw) && kw.length > bestScore) { bestScore = kw.length; bestCat = catId; }
        }
      }
      const cat = bestCat ? getCatById(bestCat, 'expense') : null;
      const rule = getActiveRule();
      const bucket = cat?.bucket || rule.buckets[0].name;
      // 桶名匹配：如果cat.bucket不在当前法则中，做模糊匹配
      const finalBucket = matchBucket(bucket, rule.buckets) || rule.buckets[0].name;
      const tx = { id: uid(), type: 'expense', amount, note: note || (cat?.name || '支出'), categoryId: bestCat || 'otherexp', bucket: finalBucket, date: todayStr(), time: nowTimeStr() };
      state.transactions.push(tx);
      saveState();
      renderAll();
      addLobsterMsg('bot', `🦞 已记录：${note||cat?.name||'支出'} ${fmtMoney(amount)}\n分类：${cat?.name||'其他'} → ${bucket}`);
      checkBudgetAlert(tx);
      return;
    }
  }

  // Report commands
  if (lower.includes('报告') || lower.includes('月报') || lower.includes('收支')) {
    const monthTx = getMonthTx();
    const income = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const rule = getActiveRule();
    let bucketReport = rule.buckets.map(b => {
      const spent = monthTx.filter(t=>t.type==='expense'&&t.bucket===b.name).reduce((s,t)=>s+t.amount,0);
      return `${b.name}：${fmtMoney(spent)}（${b.pct}%）`;
    }).join('\n');
    const cycleLabel = (state.cycleStartDay||1)===1?'本月':'本期';
    addLobsterMsg('bot', `🦞 ${cycleLabel}财务报告\n\n💰 收入：${fmtMoney(income)}\n💸 支出：${fmtMoney(expense)}\n📊 结余：${fmtMoney(income-expense)}\n\n📁 资金桶分布：\n${bucketReport}\n\n${expense>income?'⚠️ 支出超过收入，建议减少弹性消费！':'✅ 收支状况良好，继续保持！'}`);
    return;
  }

  // Budget check
  if (lower.includes('预算') || lower.includes('提醒')) {
    const monthTx = getMonthTx();
    const rule = getActiveRule();
    let alerts = [];
    rule.buckets.forEach(b => {
      const budget = state.budgets.buckets[b.name];
      if (budget > 0) {
        const spent = monthTx.filter(t=>t.type==='expense'&&t.bucket===b.name).reduce((s,t)=>s+t.amount,0);
        const ratio = spent / budget;
        if (ratio >= 1) alerts.push(`🔴 ${b.name} 已超支 ${fmtMoney(spent-budget)}`);
        else if (ratio >= 0.8) alerts.push(`🟡 ${b.name} 达预算80%`);
        else alerts.push(`🟢 ${b.name} 剩余 ${fmtMoney(budget-spent)}`);
      }
    });
    addLobsterMsg('bot', `🦞 预算提醒：\n\n${alerts.length ? alerts.join('\n') : '未设置预算，前往设置页配置'}`);
    return;
  }

  // Query specific category
  if (lower.includes('查') || lower.includes('多少') || lower.includes('花了')) {
    const monthTx = getMonthTx();
    let matched = null;
    for (const [catId, keywords] of Object.entries(AI_KEYWORDS)) {
      for (const kw of keywords) {
        if (lower.includes(kw)) { matched = catId; break; }
      }
      if (matched) break;
    }
    if (matched) {
      const cat = getCatById(matched, 'expense');
      const spent = monthTx.filter(t=>t.type==='expense'&&t.categoryId===matched).reduce((s,t)=>s+t.amount,0);
      const count = monthTx.filter(t=>t.type==='expense'&&t.categoryId===matched).length;
      addLobsterMsg('bot', `🦞 本月「${cat?.name||'未知'}」消费：\n\n💸 总计：${fmtMoney(spent)}\n📝 笔数：${count}笔`);
      return;
    }
  }

  // Savings progress
  if (lower.includes('存钱') || lower.includes('目标') || lower.includes('进度')) {
    if (!state.goals.length) { addLobsterMsg('bot', '🦞 还没有设置存钱目标哦，去目标页创建一个吧！'); return; }
    const report = state.goals.map(g => {
      const totalSaved = getGoalTotalSaved(g);
      const pct = g.target > 0 ? (totalSaved/g.target*100).toFixed(1) : 0;
      const daysLeft = g.deadline ? Math.max(0,Math.ceil((new Date(g.deadline + 'T23:59:59+08:00') - cnNow())/86400000)) : null;
      return `🎯 ${g.name}：${fmtMoney(totalSaved)}/${fmtMoney(g.target)}（${pct}%）${g.bucket?' 🔗'+g.bucket:''}${daysLeft!==null?' · 剩余'+daysLeft+'天':''}`;
    }).join('\n');
    addLobsterMsg('bot', `🦞 存钱进度：\n\n${report}`);
    return;
  }

  // Default
  addLobsterMsg('bot', `🦞 我理解你的意思了！你可以试试对我说：\n• "午餐花了25元"（自动记账）\n• "本月收支报告"\n• "预算提醒"\n• "查一下餐饮花了多少"\n• "存钱进度"`);
}

// Voice input
function startVoiceInput() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('当前浏览器不支持语音输入', 'warning');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = e => {
    const text = e.results[0][0].transcript;
    document.getElementById('lobsterInput').value = text;
    sendLobster();
  };
  recognition.onerror = e => showToast('语音识别失败', 'danger');
  recognition.start();
  showToast('正在听你说话...', 'success');
}

// ==================== TOAST ====================
function showToast(msg, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ==================== CELEBRATION ====================
function celebrate() {
  const container = document.getElementById('celebration');
  container.classList.add('show');
  container.innerHTML = '';
  const colors = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899'];
  for (let i = 0; i < 60; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 2 + 's';
    confetti.style.width = (Math.random() * 8 + 4) + 'px';
    confetti.style.height = (Math.random() * 8 + 4) + 'px';
    container.appendChild(confetti);
  }
  setTimeout(() => { container.classList.remove('show'); container.innerHTML = ''; }, 4000);
  showToast('🎉 恭喜！存钱目标达成！', 'success');
}
